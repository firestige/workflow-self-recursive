name: Iteration 3 Execution CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iter3-execution-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify pinned component worktrees
        run: |
          git submodule status --recursive
          test "$(git rev-parse HEAD:workflow-package)" = 08d0a4e7d2862203107fde647c21a756734586c6
          test "$(git rev-parse HEAD:execution-system)" = 1cb19faa78aafa380eb93f1eda0cb9819ee1188e
          test "$(git rev-parse HEAD:evidence-system)" = 5065cf8aede5191c3a702f3516e2f8db8af36002
          test "$(git rev-parse HEAD:evolution-system)" = b302595942b2307514570a47be9ed87f26f8cf84
          test "$(git rev-parse HEAD:system-contracts)" = 352f5c771ff0abd11acb80c58dc7ea528a729dca
          test "$(git rev-parse HEAD:wsr-dsh)" = dc1395f15daf4f110ffea63f74b8c41eb5639631
          test -z "$(git status --porcelain --untracked-files=no)"
          test -z "$(git -C execution-system status --porcelain --untracked-files=no)"
          test -z "$(git -C evolution-system status --porcelain --untracked-files=no)"
          test -z "$(git -C system-contracts status --porcelain --untracked-files=no)"
          test -z "$(git -C workflow-package status --porcelain --untracked-files=no)"
          test -z "$(git -C wsr-dsh status --porcelain --untracked-files=no)"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: execution-system/.node-version

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.23.0

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: 0.11.28
          python-version: "3.14"

      - name: Install exact dependencies
        working-directory: execution-system
        run: pnpm install --frozen-lockfile

      - name: Install exact WSR DSH dependencies
        run: npm --prefix wsr-dsh ci --ignore-scripts --no-audit --no-fund

      - name: Install frozen contract checker dependencies
        run: |
          npm --prefix system-contracts/workflow-dsl ci
          npm --prefix system-contracts/workflow-dsl-2-candidate ci
          npm --prefix system-contracts/observation ci
          npm --prefix system-contracts/evaluation ci

      - name: Run Execution full, coverage, static, and build gates
        working-directory: execution-system
        run: |
          pnpm test:full
          pnpm test:coverage
          pnpm typecheck
          pnpm build
          pnpm check:generated
          git fetch --unshallow --tags --force 2>&1 || git fetch --tags --force 2>&1 || true
          pnpm changelog:check
          pnpm harness static
          pnpm harness feasibility
          pnpm verify:dsh-intake
          pnpm verify:iteration3-docs

      - name: Qualify exact public Workflow source and cache in a clean directory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --test qualification/iter6/workflow-source/qualify.test.mjs
          node workflow-package/release/cli/release.cjs build \
            "$RUNNER_TEMP/workflow-v2-assets" \
            "$(git rev-parse HEAD:workflow-package)" \
            "$(git rev-parse HEAD:system-contracts)"
          node workflow-package/release/cli/release.cjs qualify \
            "$RUNNER_TEMP/workflow-v2-assets" \
            system-contracts/workflow-dsl
          node qualification/iter6/workflow-source/qualify.mjs
          uv run --project evolution-system --python 3.14 \
            pytest -q evolution-system/tests/unit/workflow_sources

      - name: Qualify frozen contracts and Package consumers
        run: |
          npm --prefix system-contracts/workflow-dsl test
          npm --prefix system-contracts/delivery-admission test
          npm --prefix system-contracts/observation test
          npm --prefix system-contracts/evaluation test
          npm --prefix system-contracts/evaluation run check:example
          node system-contracts/workflow-dsl/tools/check-example.cjs workflow-package/system-design/definition
          node system-contracts/workflow-dsl/tools/check-example.cjs workflow-package/implementation/definition
          node system-contracts/workflow-dsl/tools/check-example.cjs workflow-package/hello-world-workflow/definition
          node system-contracts/workflow-dsl/tools/run-conformance.cjs workflow-package/system-design/definition
          node system-contracts/workflow-dsl/tools/run-conformance.cjs workflow-package/implementation/definition
          node system-contracts/workflow-dsl/tools/run-conformance.cjs workflow-package/hello-world-workflow/definition
          node system-contracts/workflow-dsl/tools/test-wave6-contract.cjs
          npm --prefix workflow-package/implementation/cli test
          npm --prefix workflow-package/implementation/cli run check

      - name: Build and verify public artifacts
        working-directory: execution-system
        run: |
          pnpm release:artifacts "$RUNNER_TEMP/execution-release"
          pnpm release:verify "$RUNNER_TEMP/execution-release"

      - name: Clean npm consumer imports package-root public surface
        run: |
          VERSION="$(node -p 'require("./execution-system/package.json").version')"
          mkdir "$RUNNER_TEMP/execution-consumer"
          cd "$RUNNER_TEMP/execution-consumer"
          npm init -y
          npm install --ignore-scripts "$RUNNER_TEMP/execution-release/wsr-execution-$VERSION.tgz"
          node --input-type=module -e 'import { DefaultExecutionApplicationFactory, loadExecutionInstallationConfig } from "wsr-execution"; if (![DefaultExecutionApplicationFactory, loadExecutionInstallationConfig].every(Boolean)) process.exit(1)'

      - name: Qualify exact WSR DSH source bundles
        run: |
          export PATH="$GITHUB_WORKSPACE/execution-system/node_modules/.bin:$PATH"
          test "$(dsh --version)" = 0.1.1-rc.2
          npm --prefix wsr-dsh test
          npm --prefix wsr-dsh run build
          npm --prefix wsr-dsh run pack:verify
          npm --prefix wsr-dsh run qualify:clean-profile
          WSR_RELEASE_CHANNEL=candidate npm --prefix wsr-dsh run release:candidate -- "$RUNNER_TEMP/wsr-dsh-release"
          npm --prefix wsr-dsh run provenance:verify -- "$RUNNER_TEMP/wsr-dsh-release"

      - name: Verify independent Workflow Package release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir "$RUNNER_TEMP/workflow-release"
          curl -fL -o "$RUNNER_TEMP/workflow-release/workflow-package-release-0.3.0.json" https://github.com/firestige/wsr-workflow-package/releases/download/0.3.0/workflow-package-release-0.3.0.json
          curl -fL -o "$RUNNER_TEMP/workflow-release/workflow-package-implementation-workflow-0.3.0.tar.gz" https://github.com/firestige/wsr-workflow-package/releases/download/0.3.0/workflow-package-implementation-workflow-0.3.0.tar.gz
          curl -fL -o "$RUNNER_TEMP/workflow-release/workflow-package-system-design-workflow-0.3.0.tar.gz" https://github.com/firestige/wsr-workflow-package/releases/download/0.3.0/workflow-package-system-design-workflow-0.3.0.tar.gz
          test "$(sha256sum "$RUNNER_TEMP/workflow-release/workflow-package-release-0.3.0.json" | cut -d' ' -f1)" = c585123a882083e31b0e115e7edb31fc75151d9e111914e1e30dd56a1e5aca51
          test "$(sha256sum "$RUNNER_TEMP/workflow-release/workflow-package-implementation-workflow-0.3.0.tar.gz" | cut -d' ' -f1)" = f5b25f82771efe5472439eced0038207d66416f139cdd4b207a9645b100ed148
          test "$(sha256sum "$RUNNER_TEMP/workflow-release/workflow-package-system-design-workflow-0.3.0.tar.gz" | cut -d' ' -f1)" = abd818546d413f36f69693603b897eac25f138db079ea1af08336e7544d98231

          mkdir "$RUNNER_TEMP/hello-world-release"
          gh release download workflow-package/hello-world-workflow/v0.1.0 \
            --repo firestige/wsr-workflow-package \
            --dir "$RUNNER_TEMP/hello-world-release"
          test "$(find "$RUNNER_TEMP/hello-world-release" -type f | wc -l | tr -d ' ')" = 3
          test "$(sha256sum "$RUNNER_TEMP/hello-world-release/workflow-package-hello-world-workflow-0.1.0.tar.gz" | cut -d' ' -f1)" = 31348e57be3a8ce9bb078cbe26ba41203083a25157cba90637fde6ffb6af5f70
          test "$(sha256sum "$RUNNER_TEMP/hello-world-release/workflow-package-hello-world-workflow-0.1.0.json" | cut -d' ' -f1)" = 113b981f8913d8384bc0ed11e8792fc58fbcfce934bf4154c0780c4d2bfb42c2
          test "$(sha256sum "$RUNNER_TEMP/hello-world-release/workflow-package-hello-world-workflow-0.1.0.tar.gz.sha256" | cut -d' ' -f1)" = f6c4c33bcc2ee803844509712e458183027f883933ed00057e1198dc4ef4f16b

      - name: Enforce protected Iteration 2 and frozen-scope boundaries
        run: |
          test "$(git -C workflow-package rev-parse ed2a0bddda1eeaba77f19c5e543fe0c82d55fefb^{tree}:implementation)" = "$(git -C workflow-package rev-parse HEAD^{tree}:implementation)"
          test "$(git -C workflow-package rev-parse ed2a0bddda1eeaba77f19c5e543fe0c82d55fefb^{tree}:system-design)" = "$(git -C workflow-package rev-parse HEAD^{tree}:system-design)"
          test "$(git -C system-contracts rev-parse 9e6ba782b742f49f3d2392c9af37ebd4ff328bc8^{tree}:delivery-admission)" = "$(git -C system-contracts rev-parse HEAD^{tree}:delivery-admission)"
          test "$(git -C system-contracts rev-parse 9e6ba782b742f49f3d2392c9af37ebd4ff328bc8^{tree}:evaluation)" = "$(git -C system-contracts rev-parse HEAD^{tree}:evaluation)"
          test "$(git -C system-contracts rev-parse 9e6ba782b742f49f3d2392c9af37ebd4ff328bc8^{tree}:observation)" = "$(git -C system-contracts rev-parse HEAD^{tree}:observation)"
          test "$(git -C system-contracts rev-parse 9e6ba782b742f49f3d2392c9af37ebd4ff328bc8^{tree}:workflow-dsl)" = "$(git -C system-contracts rev-parse HEAD^{tree}:workflow-dsl)"
          pnpm --dir execution-system exec tsx scripts/static-boundary-check.ts
          if git grep -n -E '#87.*(complete|closed|done)|Workflow Contract evolution.*(complete|closed|done)|Delivery Admission Contract evolution.*(complete|closed|done)' -- docs; then
            exit 1
          fi
