name: Iteration 3 Execution CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iter3-execution-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify component worktrees
        run: |
          git submodule status --recursive
          test -z "$(git status --porcelain --untracked-files=no)"
          test -z "$(git -C execution-system status --porcelain --untracked-files=no)"
          test -z "$(git -C evolution-system status --porcelain --untracked-files=no)"
          test -z "$(git -C system-contracts status --porcelain --untracked-files=no)"
          test -z "$(git -C workflow-package status --porcelain --untracked-files=no)"
          test -z "$(git -C wsr-dsh status --porcelain --untracked-files=no)"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: execution-system/.node-version

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.23.0

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: 0.11.28
          python-version: "3.14"

      - name: Install exact dependencies
        working-directory: execution-system
        run: pnpm install --frozen-lockfile

      - name: Install exact WSR DSH dependencies
        run: npm --prefix wsr-dsh ci --ignore-scripts --no-audit --no-fund

      - name: Install frozen contract checker dependencies
        run: |
          npm --prefix system-contracts/workflow-dsl-2-candidate ci
          npm --prefix system-contracts/observation ci
          npm --prefix system-contracts/evaluation ci

      - name: Run Execution full, coverage, static, and build gates
        working-directory: execution-system
        run: |
          pnpm test:full
          pnpm test:coverage
          pnpm typecheck
          pnpm build
          pnpm check:generated
          git fetch --unshallow --tags --force 2>&1 || git fetch --tags --force 2>&1 || true
          pnpm harness static
          pnpm harness feasibility

      - name: Qualify exact public Workflow source and cache in a clean directory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --test qualification/iter6/workflow-source/qualify.test.mjs
          node workflow-package/release/cli/release.cjs build \
            "$RUNNER_TEMP/workflow-v2-assets" \
            "$(git rev-parse HEAD:workflow-package)" \
            "$(git rev-parse HEAD:system-contracts)"
          node workflow-package/release/cli/release.cjs qualify \
            "$RUNNER_TEMP/workflow-v2-assets" \
            system-contracts
          node qualification/iter6/workflow-source/qualify.mjs
          uv run --project evolution-system --python 3.14 \
            pytest -q evolution-system/tests/unit/workflow_sources

      - name: Qualify frozen contracts and Package consumers
        run: |
          npm --prefix system-contracts/workflow-dsl-2-candidate test
          npm --prefix system-contracts/delivery-admission test
          npm --prefix system-contracts/observation test
          npm --prefix system-contracts/evaluation test
          npm --prefix system-contracts/evaluation run check:example
          node system-contracts/workflow-dsl-2-candidate/generated/tools/check-example.cjs workflow-package/hello-world-workflow/definition
          node system-contracts/workflow-dsl-2-candidate/generated/tools/check-example.cjs workflow-package/system-design/definition
          node system-contracts/workflow-dsl-2-candidate/generated/tools/check-example.cjs workflow-package/implementation/definition
          node --test workflow-package/test/tooling/dsl2-first-party-migration.test.cjs
          npm --prefix workflow-package/implementation/cli test
          npm --prefix workflow-package/implementation/cli run check

      - name: Build and verify public artifacts
        working-directory: execution-system
        run: |
          pnpm release:artifacts "$RUNNER_TEMP/execution-release"
          pnpm release:verify "$RUNNER_TEMP/execution-release"

      - name: Clean npm consumer imports package-root public surface
        run: |
          VERSION="$(node -p 'require("./execution-system/package.json").version')"
          mkdir "$RUNNER_TEMP/execution-consumer"
          cd "$RUNNER_TEMP/execution-consumer"
          npm init -y
          npm install --ignore-scripts "$RUNNER_TEMP/execution-release/wsr-execution-$VERSION.tgz"
          node --input-type=module -e 'import { DefaultExecutionApplicationFactory, loadExecutionInstallationConfig } from "wsr-execution"; if (![DefaultExecutionApplicationFactory, loadExecutionInstallationConfig].every(Boolean)) process.exit(1)'

      - name: Qualify exact WSR DSH source bundles
        env:
          WSR_CHROME_BINARY: /usr/bin/google-chrome
        run: |
          export PATH="$GITHUB_WORKSPACE/execution-system/node_modules/.bin:$PATH"
          test "$(dsh --version)" = 0.1.1-rc.2
          npm --prefix wsr-dsh test
          npm --prefix wsr-dsh run build
          npm --prefix wsr-dsh run pack:verify
          npm --prefix wsr-dsh run qualify:clean-profile
          npm --prefix wsr-dsh run qualify:lifecycle
          npm --prefix wsr-dsh run qualify:provider-routing
          WSR_DSH_VERSION="$(node -p 'require("./wsr-dsh/package.json").version')"
          WSR_RELEASE_CHANNEL=candidate WSR_CANDIDATE_TAG="${WSR_DSH_VERSION}-rc.1" npm --prefix wsr-dsh run release:candidate -- "$RUNNER_TEMP/wsr-dsh-release"
          npm --prefix wsr-dsh run provenance:verify -- "$RUNNER_TEMP/wsr-dsh-release"
          npm --prefix wsr-dsh run release:qualify -- "$RUNNER_TEMP/wsr-dsh-release"
          npm --prefix wsr-dsh run release:verify -- "$RUNNER_TEMP/wsr-dsh-release"

      - name: Verify independent Workflow Package release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir "$RUNNER_TEMP/implementation-release" "$RUNNER_TEMP/system-design-release"
          gh release download workflow-package/implementation-workflow/v0.4.1 --repo firestige/wsr-workflow-package --dir "$RUNNER_TEMP/implementation-release"
          gh release download workflow-package/system-design-workflow/v0.4.1 --repo firestige/wsr-workflow-package --dir "$RUNNER_TEMP/system-design-release"
          test "$(find "$RUNNER_TEMP/implementation-release" -type f | wc -l | tr -d ' ')" = 4
          test "$(find "$RUNNER_TEMP/system-design-release" -type f | wc -l | tr -d ' ')" = 4
          test "$(sha256sum "$RUNNER_TEMP/implementation-release/workflow-package-implementation-workflow-0.4.1.tar.gz" | cut -d' ' -f1)" = 0fa0e8849cc5a38d7e4f24101d5a92ac89205fa32b7f535daef5f00b72fd5331
          test "$(sha256sum "$RUNNER_TEMP/system-design-release/workflow-package-system-design-workflow-0.4.1.tar.gz" | cut -d' ' -f1)" = 514ad1cc9d052d26d276e33b5fa6f977a69fb39f85b282e6e58fc30624df87d2

      - name: Enforce protected Iteration 2 and frozen-scope boundaries
        run: |
          test "$(git -C system-contracts rev-parse 9e6ba782b742f49f3d2392c9af37ebd4ff328bc8^{tree}:delivery-admission)" = "$(git -C system-contracts rev-parse HEAD^{tree}:delivery-admission)"
          test "$(git -C system-contracts rev-parse 9e6ba782b742f49f3d2392c9af37ebd4ff328bc8^{tree}:evaluation)" = "$(git -C system-contracts rev-parse HEAD^{tree}:evaluation)"
          test "$(git -C system-contracts rev-parse 9e6ba782b742f49f3d2392c9af37ebd4ff328bc8^{tree}:observation)" = "$(git -C system-contracts rev-parse HEAD^{tree}:observation)"
          pnpm --dir execution-system exec tsx scripts/static-boundary-check.ts
          if git grep -n -E '#87.*(complete|closed|done)|Workflow Contract evolution.*(complete|closed|done)|Delivery Admission Contract evolution.*(complete|closed|done)' -- docs; then
            exit 1
          fi
