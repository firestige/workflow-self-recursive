name: Iteration 2 Runner CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iter2-runner-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify frozen submodule identities
        run: |
          test "$(git -C execution-system rev-parse HEAD)" = "b00dc40137259eee4dc488b1781fde7ed731e36e"
          test "$(git -C workflow-package rev-parse HEAD)" = "ed2a0bddda1eeaba77f19c5e543fe0c82d55fefb"
          test "$(git -C system-contracts rev-parse HEAD)" = "c8e090f80073e3a4a37063d2d0165f190f2ec7f1"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: execution-system/.node-version

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Install Runner dependencies
        working-directory: execution-system
        run: pnpm install --frozen-lockfile

      - name: Install Workflow Contract dependencies
        working-directory: system-contracts/workflow-dsl
        run: npm ci

      - name: Install Observation Contract dependencies
        working-directory: system-contracts/observation
        run: npm ci

      - name: Run Runner full and coverage gates
        working-directory: execution-system
        run: |
          pnpm test
          pnpm test:coverage

      - name: Run Runner static and build gates
        working-directory: execution-system
        run: |
          pnpm typecheck
          pnpm build
          pnpm check:generated
          pnpm harness static
          pnpm harness feasibility

      - name: Qualify canonical first-party Packages
        run: |
          node system-contracts/workflow-dsl/tools/check-example.cjs workflow-package/system-design/definition
          node system-contracts/workflow-dsl/tools/check-example.cjs workflow-package/implementation/definition
          node system-contracts/workflow-dsl/tools/run-conformance.cjs workflow-package/system-design/definition
          node system-contracts/workflow-dsl/tools/run-conformance.cjs workflow-package/implementation/definition
          node system-contracts/workflow-dsl/tools/test-wave6-contract.cjs

      - name: Run Implementation CLI suite
        working-directory: workflow-package/implementation/cli
        run: |
          npm test
          npm run check

      - name: Reject the superseded Runtime Profile name
        run: |
          if git grep -n "first-party-langgraph-runtime-profile" -- README.md README.zh-CN.md docs; then
            exit 1
          fi

      - name: Enforce Runner document ownership and readable IDs
        run: |
          test ! -d docs/systems/runtime
          if git grep -n -E 'Runner Runtime Profile|systems/runtime|runner-runtime-profile' -- README.md README.zh-CN.md docs; then
            exit 1
          fi
          if git grep -n -E '\b(SC-WI-[0-9]+|AF-WI-[0-9]+|DEC-WI-[0-9]+|EX-U-[0-9]+|EX-MOD-[0-9]+|runner-TERMINAL-SETTLEMENT-RECORD-[0-9]+|runner\.module\.[0-9]+)\b' -- README.md README.zh-CN.md docs; then
            exit 1
          fi
