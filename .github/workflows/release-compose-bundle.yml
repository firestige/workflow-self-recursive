name: Publish WSR bundles

on:
  workflow_dispatch:
    inputs:
      bundle_kind:
        description: Bundle to publish
        required: true
        default: compose
        type: choice
        options:
          - compose
          - product
      authority_ref:
        description: Immutable superproject ref containing the qualified manifest
        required: true
        type: string
      release_manifest:
        description: Superproject-relative release manifest path
        required: true
        type: string
permissions:
  contents: write

jobs:
  build-and-qualify-compose:
    if: inputs.bundle_kind == 'compose'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.authority_ref }}
          fetch-depth: 0

      - name: Validate immutable manifest location
        env:
          RELEASE_MANIFEST: ${{ inputs.release_manifest }}
        run: |
          case "$RELEASE_MANIFEST" in release/compose/*.json) ;; *) exit 1 ;; esac
          test -f "$RELEASE_MANIFEST"

      - uses: ./.github/actions/build-qualify-bundle
        with:
          bundle_kind: compose
          release_manifest: ${{ inputs.release_manifest }}
          require_final_version: 'true'

      - name: Verify rc predecessor was published and matches its manifest asset
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MANIFEST: ${{ inputs.release_manifest }}
        run: |
          # The predecessor is identified by content (check-ga-manifest.mjs), not by a
          # bounded `gh release list` scan: the exact rc version (with ordinal) is read
          # from the matched local manifest, so the release lookup is a single-tag
          # `gh release view` regardless of how many releases the repository has, and
          # promotion is pinned to the newest content-equivalent rc when several
          # ordinals share a version prefix.
          if ! CHECK_OUT="$(node scripts/check-ga-manifest.mjs "$RELEASE_MANIFEST" --verify-coordinates 2>&1)"; then
            echo "$CHECK_OUT"
            echo "check-ga-manifest failed — GA manifest is not a clean promotion of a published rc" >&2
            exit 1
          fi
          echo "$CHECK_OUT"
          RC_PATH="$(printf '%s\n' "$CHECK_OUT" | sed -n 's/^promoted from: //p')"
          if [ -z "$RC_PATH" ]; then
            echo "no rc predecessor found for $RELEASE_MANIFEST — GA must be promoted from a published candidate, not invented" >&2
            exit 1
          fi
          RC_VERSION="$(jq -er '.version' "$RC_PATH")"
          TAG="compose-$RC_VERSION"
          if [ "$(gh release view "$TAG" --json isPrerelease --jq '.isPrerelease' 2>/dev/null)" != "true" ]; then
            echo "no published prerelease $TAG — GA must be promoted from a published candidate, not invented" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/rc-asset"
          gh release download "$TAG" --pattern '*.release.json' --dir "$RUNNER_TEMP/rc-asset" --clobber
          ASSET="$(ls "$RUNNER_TEMP"/rc-asset/*.release.json)"
          if ! cmp -s "$RC_PATH" "$ASSET"; then
            echo "published $TAG's manifest asset differs from $RC_PATH — the published rc does not match its repository manifest" >&2
            exit 1
          fi
          echo "promoted from: $TAG ($RC_PATH, asset-verified)"

      - name: Publish stable Compose bundle Release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "compose-$VERSION" >/dev/null 2>&1; then
            echo "Compose release already exists: compose-$VERSION" >&2
            exit 1
          fi
          gh release create "compose-$VERSION" \
            "$ARCHIVE" "$CHECKSUM" "$RELEASE_ASSET_MANIFEST" \
            --target "$(git rev-parse HEAD)" \
            --title "WSR Docker Compose bundle $VERSION" \
            --notes "Exact-digest Docker Compose bundle for WSR Evidence and Evolution."

  build-and-qualify-product:
    if: inputs.bundle_kind == 'product'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.authority_ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Validate immutable product manifest
        env:
          RELEASE_MANIFEST: ${{ inputs.release_manifest }}
        run: |
          case "$RELEASE_MANIFEST" in release/product/*.json) ;; *) exit 1 ;; esac
          test -f "$RELEASE_MANIFEST"
          VERSION="$(jq -er '.release' "$RELEASE_MANIFEST")"
          test "$VERSION" = "${VERSION%%-*}"
          test "$(jq -er '.version' product-operations/package.json)" = "$VERSION"
          cmp "$RELEASE_MANIFEST" "product-operations/manifests/product-$VERSION.json"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: ./.github/actions/build-qualify-bundle
        with:
          bundle_kind: product
          release_manifest: ${{ inputs.release_manifest }}
          require_final_version: 'true'

      - name: Verify rc predecessor was published and matches its manifest asset
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MANIFEST: ${{ inputs.release_manifest }}
        run: |
          # Same reasoning as the compose job: the exact rc version comes from the
          # content-matched local manifest, so the lookup is a single tag, never a
          # bounded list scan, and promotion is pinned to the newest
          # content-equivalent rc.
          if ! CHECK_OUT="$(node scripts/check-ga-manifest.mjs "$RELEASE_MANIFEST" --verify-coordinates 2>&1)"; then
            echo "$CHECK_OUT"
            echo "check-ga-manifest failed — GA manifest is not a clean promotion of a published rc" >&2
            exit 1
          fi
          echo "$CHECK_OUT"
          RC_PATH="$(printf '%s\n' "$CHECK_OUT" | sed -n 's/^promoted from: //p')"
          if [ -z "$RC_PATH" ]; then
            echo "no rc predecessor found for $RELEASE_MANIFEST — GA must be promoted from a published candidate, not invented" >&2
            exit 1
          fi
          RC_VERSION="$(jq -er '.release' "$RC_PATH")"
          TAG="product-$RC_VERSION"
          if [ "$(gh release view "$TAG" --json isPrerelease --jq '.isPrerelease' 2>/dev/null)" != "true" ]; then
            echo "no published prerelease $TAG — GA must be promoted from a published candidate, not invented" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/rc-asset"
          gh release download "$TAG" --pattern '*.release.json' --dir "$RUNNER_TEMP/rc-asset" --clobber
          ASSET="$(ls "$RUNNER_TEMP"/rc-asset/*.release.json)"
          if ! cmp -s "$RC_PATH" "$ASSET"; then
            echo "published $TAG's manifest asset differs from $RC_PATH — the published rc does not match its repository manifest" >&2
            exit 1
          fi
          echo "promoted from: $TAG ($RC_PATH, asset-verified)"

      - name: Publish stable product Release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "product-$VERSION" >/dev/null 2>&1; then
            echo "Product release already exists: product-$VERSION" >&2
            exit 1
          fi
          gh release create "product-$VERSION" \
            "$ARCHIVE" "$CHECKSUM" "$RELEASE_ASSET_MANIFEST" "$CONFIG_EXAMPLE" \
            --target "$(git rev-parse HEAD)" \
            --title "WSR product operations $VERSION" \
            --notes "Installable top-level operations bundle for the exact WSR $VERSION compatibility manifest."
