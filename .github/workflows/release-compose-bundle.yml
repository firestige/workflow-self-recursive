name: Build published-image Compose bundle

on:
  workflow_dispatch:
    inputs:
      authority_ref:
        description: Immutable superproject ref containing the qualified image manifest
        required: true
        type: string
      release_manifest:
        description: Superproject-relative release/compose manifest path
        required: true
        type: string
  workflow_call:
    inputs:
      authority_ref:
        required: true
        type: string
      release_manifest:
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.authority_ref }}
          fetch-depth: 0

      - name: Validate immutable manifest location
        env:
          RELEASE_MANIFEST: ${{ inputs.release_manifest }}
        run: |
          case "$RELEASE_MANIFEST" in release/compose/*.json) ;; *) exit 1 ;; esac
          test -f "$RELEASE_MANIFEST"

      - name: Verify exact first-party qualification evidence
        env:
          RELEASE_MANIFEST: ${{ inputs.release_manifest }}
        run: |
          mkdir "$RUNNER_TEMP/compose-qualification"
          for name in evidence evolution; do
            URL="$(jq -er --arg name "$name" '.images[$name].provenance' "$RELEASE_MANIFEST")"
            curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
              "$URL" --output "$RUNNER_TEMP/compose-qualification/$name.json"
          done
          deployment/published/validate-qualification.py "$RELEASE_MANIFEST" \
            "$RUNNER_TEMP/compose-qualification/evidence.json" \
            "$RUNNER_TEMP/compose-qualification/evolution.json"

      - uses: docker/setup-buildx-action@v3

      - name: Verify exact image platform matrix
        env:
          RELEASE_MANIFEST: ${{ inputs.release_manifest }}
        run: |
          for name in postgres evidence evolution; do
            IMAGE="$(jq -er --arg name "$name" '.images[$name].coordinate' "$RELEASE_MANIFEST")"
            docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}' \
              > "$RUNNER_TEMP/$name-manifest.json"
            jq -e '[.manifests[] | select(.platform.os == "linux") | .platform.architecture] |
              (index("amd64") != null and index("arm64") != null)' \
              "$RUNNER_TEMP/$name-manifest.json" >/dev/null
          done

      - name: Build versioned bundle
        env:
          RELEASE_MANIFEST: ${{ inputs.release_manifest }}
        run: |
          VERSION="$(python3 -c 'import json,os; print(json.load(open(os.environ["RELEASE_MANIFEST"]))["version"])')"
          test "$VERSION" = "${VERSION%%-*}"
          deployment/published/build-bundle.py "$RELEASE_MANIFEST" "$RUNNER_TEMP/wsr-services-$VERSION"
          echo "BUNDLE=$RUNNER_TEMP/wsr-services-$VERSION" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Requalify generated bundle
        run: |
          cd "$BUNDLE"
          sha256sum --check SHA256SUMS
          docker compose -f compose.yaml config --quiet
          ./wsr-compose host-config > "$RUNNER_TEMP/loopback-host.json"
          ./wsr-compose preflight
          jq -e '.schemaVersion == "wsr.loopback-host@1.0.0" and
            .observation.baseUrl == .services.evidence.baseUrl' \
            "$RUNNER_TEMP/loopback-host.json" >/dev/null
          test "$(grep -c '@sha256:' compose.yaml)" = 4
          test -z "$(grep -E '(^|[[:space:]])build:|\.\./(evidence|evolution)-system|bi-app|workflow-builder' compose.yaml || true)"

      - name: Archive exact qualified bundle
        env:
          RELEASE_MANIFEST: ${{ inputs.release_manifest }}
        run: |
          ARCHIVE="$RUNNER_TEMP/wsr-services-$VERSION.tar.gz"
          CHECKSUM="$ARCHIVE.sha256"
          RELEASE_ASSET_MANIFEST="$RUNNER_TEMP/wsr-services-$VERSION.release.json"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf "$ARCHIVE" -C "$RUNNER_TEMP" "wsr-services-$VERSION"
          cd "$RUNNER_TEMP"
          sha256sum "$(basename "$ARCHIVE")" > "$CHECKSUM"
          cp "$GITHUB_WORKSPACE/$RELEASE_MANIFEST" "$RELEASE_ASSET_MANIFEST"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
          echo "CHECKSUM=$CHECKSUM" >> "$GITHUB_ENV"
          echo "RELEASE_ASSET_MANIFEST=$RELEASE_ASSET_MANIFEST" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: published-image-compose-bundle
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.CHECKSUM }}
            ${{ env.RELEASE_ASSET_MANIFEST }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish stable Compose bundle Release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "compose-$VERSION" >/dev/null 2>&1; then
            echo "Compose release already exists: compose-$VERSION" >&2
            exit 1
          fi
          gh release create "compose-$VERSION" \
            "$ARCHIVE" "$CHECKSUM" "$RELEASE_ASSET_MANIFEST" \
            --target "$(git rev-parse HEAD)" \
            --title "WSR Docker Compose bundle $VERSION" \
            --notes "Exact-digest Docker Compose bundle for WSR Evidence and Evolution."
