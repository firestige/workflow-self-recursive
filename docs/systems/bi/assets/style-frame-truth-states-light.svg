<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">WSR Evidence truth states light style frame</title><desc id="desc">Light state-focused dashboard for lower-bound, unavailable, expired, incompatible and query-error cases.</desc>
  <defs><style>.bg{fill:#f4f7f9}.panel{fill:#fff;stroke:#cbd7df}.soft{fill:#eef4f6;stroke:#c7d6de}.ink{fill:#17232e;font-family:Inter,system-ui,sans-serif}.muted{fill:#5f7483;font-family:Inter,system-ui,sans-serif}.mono{fill:#425968;font-family:ui-monospace,monospace}.amber{fill:#a66200}.red{fill:#b6414b}.h1{font-size:24px;font-weight:700}.h2{font-size:18px;font-weight:650}.body{font-size:14px}.small{font-size:12px}.empty{font-size:34px;font-weight:700}</style></defs>
  <rect class="bg" width="1440" height="960"/><rect class="panel" x="32" y="24" width="1376" height="72" rx="10"/><text class="ink h1" x="56" y="67">WSR Evidence · State vocabulary</text><rect class="soft" x="1270" y="42" width="112" height="34" rx="17"/><text class="ink small" x="1294" y="64">LIGHT</text><text class="muted body" x="40" y="134">Value appears only when exact input, compatibility, coverage and sample rules permit it.</text>
  <rect class="panel" x="32" y="164" width="432" height="320" rx="10"/><text class="amber small" x="56" y="202">● LOWER BOUND</text><text class="ink h2" x="56" y="244">Token usage</text><text class="ink empty" x="56" y="300">≥ 18,420</text><text class="muted body" x="56" y="330">Reported input tokens only</text><text class="muted small" x="56" y="376">Coverage 7 / 9 · PARTIAL</text><rect fill="#dce5ea" x="56" y="428" width="376" height="8" rx="4"/><rect fill="#d58912" x="56" y="428" width="292" height="8" rx="4"/>
  <rect class="panel" x="484" y="164" width="432" height="320" rx="10"/><text class="red small" x="508" y="202">● UNAVAILABLE</text><text class="ink h2" x="508" y="244">Attributable cost</text><text class="muted empty" x="508" y="300">—</text><text class="muted body" x="508" y="330">Required source currency is missing</text><text class="mono small" x="508" y="396">MISSING_INPUT: usage-source</text><rect x="508" y="422" width="376" height="40" rx="8" fill="#fff0f1"/><text class="red small" x="526" y="447">Never converted to zero</text>
  <rect class="panel" x="936" y="164" width="472" height="320" rx="10"/><text class="red small" x="960" y="202">● EXPIRED</text><text class="ink h2" x="960" y="244">Trace detail</text><text class="muted empty" x="960" y="300">Detail unavailable</text><text class="muted body" x="960" y="330">Accepted identity retained</text><text class="mono small" x="960" y="376">trace 6fd2… · span a910…</text><rect x="960" y="422" width="416" height="40" rx="8" fill="#fff0f1"/><text class="red small" x="978" y="447">Expired ≠ absent · no reconstruction</text>
  <rect class="panel" x="32" y="504" width="672" height="392" rx="10"/><text class="ink h2" x="56" y="542">Compatibility mismatch</text><text class="muted body" x="56" y="574">The response is rejected as one typed result.</text><rect class="soft" x="56" y="606" width="624" height="112" rx="8"/><text class="muted small" x="78" y="634">EXPECTED</text><text class="mono body" x="78" y="660">evidence.query@0.1.0 · profile 1.0.0</text><text class="muted small" x="78" y="690">RECEIVED</text><text class="mono body" x="78" y="714">evidence.query@0.2.0 · unknown field</text><rect x="56" y="742" width="624" height="70" rx="8" fill="#fff0f1" stroke="#d78a91"/><text class="red small" x="78" y="770">INCOMPATIBLE</text><text class="ink body" x="78" y="794">Nothing is partially rendered; raw payload is not retained.</text>
  <rect class="panel" x="724" y="504" width="684" height="392" rx="10"/><text class="ink h2" x="748" y="542">Query unavailable</text><text class="muted body" x="748" y="574">Evidence did not return a factual result.</text><rect class="soft" x="748" y="606" width="636" height="112" rx="8"/><text class="red small" x="770" y="638">QUERY_UNAVAILABLE · HTTP 503</text><text class="ink body" x="770" y="670">No cached value is substituted.</text><text class="muted small" x="770" y="700">Existing view is visibly stale.</text><rect class="soft" x="748" y="742" width="300" height="56" rx="8"/><text class="ink body" x="770" y="776">Retry current query</text><rect class="soft" x="1064" y="742" width="320" height="56" rx="8"/><text class="ink body" x="1086" y="776">Inspect last provenance</text><text class="muted small" x="748" y="856">Text, icons and focus carry state; color is redundant.</text>
</svg>
