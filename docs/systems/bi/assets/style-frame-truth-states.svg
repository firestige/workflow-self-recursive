<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">WSR Evidence unavailable and partial state style frame</title>
  <desc id="desc">A state-focused dashboard showing unavailable, expired, incompatible, low-sample, and API error presentations without substituting zero.</desc>
  <defs><style>
    .bg{fill:#0b1117}.panel{fill:#121b24;stroke:#2b3946}.soft{fill:#17232e;stroke:#31414e}.ink{fill:#e8eef2;font-family:Inter,system-ui,sans-serif}.muted{fill:#8da0af;font-family:Inter,system-ui,sans-serif}.mono{fill:#aec0cc;font-family:ui-monospace,monospace}.cyan{fill:#52d3d8}.amber{fill:#f5b642}.red{fill:#e06c75}.h1{font-size:24px;font-weight:700}.h2{font-size:18px;font-weight:650}.body{font-size:14px}.small{font-size:12px}.empty{font-size:34px;font-weight:700}
  </style></defs>
  <rect class="bg" width="1440" height="960"/><rect class="panel" x="32" y="24" width="1376" height="72" rx="10"/><text class="ink h1" x="56" y="67">WSR Evidence · State vocabulary</text><text class="mono small" x="1160" y="62">catalog@1.0.0</text>
  <text class="muted body" x="40" y="134">A value is shown only when its exact input, compatibility, coverage, and minimum-sample rules permit it.</text>
  <rect class="panel" x="32" y="164" width="432" height="320" rx="10"/><circle class="amber" cx="60" cy="198" r="6"/><text class="amber small" x="76" y="202">LOWER BOUND</text><text class="ink h2" x="56" y="244">Token usage</text><text class="ink empty" x="56" y="300">≥ 18,420</text><text class="muted body" x="56" y="330">Reported input tokens only</text><text class="muted small" x="56" y="370">Coverage 7 / 9 · PARTIAL</text><text class="muted small" x="56" y="396">Not labeled total usage</text><rect x="56" y="428" width="376" height="8" rx="4" fill="#293845"/><rect x="56" y="428" width="292" height="8" rx="4" class="amber"/>
  <rect class="panel" x="484" y="164" width="432" height="320" rx="10"/><circle class="red" cx="512" cy="198" r="6"/><text class="red small" x="528" y="202">UNAVAILABLE</text><text class="ink h2" x="508" y="244">Attributable cost</text><text class="muted empty" x="508" y="300">—</text><text class="muted body" x="508" y="330">Required source currency is missing</text><text class="muted small" x="508" y="370">No value · never converted to 0</text><text class="mono small" x="508" y="396">MISSING_INPUT: usage-source</text><rect x="508" y="422" width="376" height="40" rx="8" fill="#281d21"/><text class="red small" x="526" y="447">Value withheld; provenance remains visible</text>
  <rect class="panel" x="936" y="164" width="472" height="320" rx="10"/><circle class="red" cx="964" cy="198" r="6"/><text class="red small" x="980" y="202">EXPIRED</text><text class="ink h2" x="960" y="244">Trace detail</text><text class="muted empty" x="960" y="300">Detail unavailable</text><text class="muted body" x="960" y="330">Accepted identity retained</text><text class="mono small" x="960" y="370">trace 6fd2… · span a910…</text><text class="muted small" x="960" y="396">Expired ≠ absent · no reconstruction</text><rect x="960" y="422" width="416" height="40" rx="8" fill="#281d21"/><text class="red small" x="978" y="447">Expired at committed retention boundary</text>
  <rect class="panel" x="32" y="504" width="672" height="392" rx="10"/><text class="ink h2" x="56" y="542">Compatibility mismatch</text><text class="muted body" x="56" y="574">The response is rejected as one typed result.</text>
  <rect class="soft" x="56" y="606" width="624" height="112" rx="8"/><text class="muted small" x="78" y="634">EXPECTED</text><text class="mono body" x="78" y="660">evidence.query@0.1.0 · profile 1.0.0</text><text class="muted small" x="78" y="690">RECEIVED</text><text class="mono body" x="78" y="714">evidence.query@0.2.0 · unknown field</text>
  <rect x="56" y="742" width="624" height="70" rx="8" fill="#281d21" stroke="#713b43"/><text class="red small" x="78" y="770">INCOMPATIBLE</text><text class="ink body" x="78" y="794">Nothing is partially rendered; raw payload is not retained.</text><text class="muted small" x="56" y="854">Start a new compatible query after configuration changes.</text>
  <rect class="panel" x="724" y="504" width="684" height="392" rx="10"/><text class="ink h2" x="748" y="542">Query unavailable</text><text class="muted body" x="748" y="574">Evidence did not return a factual result.</text>
  <rect class="soft" x="748" y="606" width="636" height="112" rx="8"/><text class="red small" x="770" y="638">QUERY_UNAVAILABLE · HTTP 503</text><text class="ink body" x="770" y="670">Evidence is unavailable or the lease pool is exhausted.</text><text class="muted small" x="770" y="700">No cached value is substituted. Existing view is marked stale.</text>
  <rect class="soft" x="748" y="742" width="300" height="56" rx="8"/><text class="ink body" x="770" y="776">Retry current query</text><rect class="soft" x="1064" y="742" width="320" height="56" rx="8"/><text class="ink body" x="1086" y="776">Inspect last provenance</text>
  <text class="muted small" x="748" y="846">Keyboard focus, text labels, and icons carry state;</text><text class="muted small" x="748" y="868">color never carries meaning alone.</text>
</svg>
