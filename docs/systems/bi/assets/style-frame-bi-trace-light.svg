<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">BI recorded Trace light style frame</title><desc id="desc">Light Trace view with parent depth, simultaneous siblings, independent LINK, orphan and Still control.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#647887"/></marker></defs><style>.bg{fill:#f4f7f9}.p{fill:#fff;stroke:#c9d4dc}.node{fill:#edf3f6;stroke:#647887}.orphan{fill:#fff;stroke:#9a5c00;stroke-dasharray:5 4}.ink{fill:#17232e;font:14px system-ui}.muted{fill:#5f7483;font:12px system-ui}.h{fill:#17232e;font:700 22px system-ui}.t{fill:#17232e;font:650 16px system-ui}.edge{stroke:#647887;stroke-width:2;marker-end:url(#arrow)}.link{stroke:#9a5c00;stroke-width:2;stroke-dasharray:7 5;fill:none}.a{fill:#087f83}.w{fill:#9a5c00}</style>
  <rect class="bg" width="1200" height="720"/><rect class="p" x="24" y="20" width="1152" height="62" rx="10"/><text class="h" x="46" y="58">Recorded Trace</text><text class="ink" x="882" y="56">Still ● · Live ○ · Outline</text>
  <rect class="p" x="24" y="98" width="806" height="594" rx="10"/><text class="muted" x="46" y="126">PARENT DEPTH · timestamps do not determine layout</text>
  <line class="edge" x1="404" y1="212" x2="246" y2="294"/><line class="edge" x1="426" y1="212" x2="588" y2="294"/><line class="edge" x1="246" y1="354" x2="246" y2="448"/>
  <path class="link" d="M282 323 C370 266 464 266 552 323"/><text class="w" x="392" y="280">LINK</text>
  <rect class="node" x="326" y="156" width="178" height="58" rx="9"/><text class="t" x="356" y="183">root span</text><text class="muted" x="356" y="203">depth 0</text>
  <rect class="node" x="154" y="296" width="184" height="60" rx="9"/><text class="t" x="178" y="324">writer call</text><text class="muted" x="178" y="346">depth 1 · sibling</text><rect class="node" x="496" y="296" width="184" height="60" rx="9"/><text class="t" x="520" y="324">reviewer call</text><text class="muted" x="520" y="346">depth 1 · sibling</text>
  <rect class="node" x="154" y="450" width="184" height="60" rx="9"/><text class="t" x="178" y="478">tool span</text><text class="muted" x="178" y="500">depth 2 · partial</text><text class="muted" x="496" y="450">ORPHAN LANE · no inferred depth</text><rect class="orphan" x="496" y="466" width="184" height="60" rx="9"/><text class="w" x="520" y="494">orphan endpoint</text><text class="muted" x="520" y="516">parent not observed</text>
  <text class="muted" x="46" y="648">Traversal: recorded depth 0 → depth 1 siblings → depth 2 → stop; orphans remain separate</text>
  <rect class="p" x="846" y="98" width="330" height="594" rx="10"/><text class="t" x="868" y="134">Node detail</text><text class="muted" x="868" y="162">trace_id / span_id</text><text class="ink" x="868" y="190">4f2a…91c / 72bd…08e</text><text class="muted" x="868" y="232">RECORDED RELATION</text><text class="ink" x="868" y="258">PARENT_EDGE</text><text class="muted" x="868" y="302">STATE</text><text class="w" x="868" y="328">PARTIAL · detail missing</text><rect class="p" x="868" y="372" width="282" height="94" rx="8"/><text class="ink" x="886" y="400">LINK is independent</text><text class="muted" x="886" y="426">No causal ordering from time</text><text class="a" x="868" y="648">返回 Evidence Console</text>
</svg>
