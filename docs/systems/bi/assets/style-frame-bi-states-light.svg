<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">BI truth and recovery states light style frame</title><desc id="desc">Light grid showing typed states with text, shape and recovery actions.</desc>
  <style>.bg{fill:#f4f7f9}.p{fill:#fff;stroke:#c9d4dc}.ink{fill:#17232e;font:14px system-ui}.muted{fill:#5f7483;font:12px system-ui}.h{fill:#17232e;font:700 22px system-ui}.t{fill:#17232e;font:650 16px system-ui}.ok{fill:#087f83}.warn{fill:#9a5c00}.bad{fill:#a93c48}.neutral{fill:#566b7a}.focus{fill:none;stroke:#6b4eff;stroke-width:3}.dash{fill:none;stroke:#9a5c00;stroke-dasharray:6 4;stroke-width:2}</style>
  <rect class="bg" width="1200" height="720"/><text class="h" x="32" y="52">Metric truth, interaction and recovery · Light</text>
  <g transform="translate(32,76)"><rect class="p" width="270" height="170" rx="10"/><circle class="ok" cx="24" cy="30" r="7"/><text class="t" x="42" y="36">AVAILABLE</text><text class="ink" x="22" y="78">0 tokens</text><text class="muted" x="22" y="106">Explicit recorded zero</text><text class="ok" x="22" y="144">查看证据</text></g>
  <g transform="translate(318,76)"><rect class="p" width="270" height="170" rx="10"/><path class="warn" d="M22 18 L34 40 L10 40 Z"/><text class="t" x="46" y="36">LOWER BOUND</text><text class="ink" x="22" y="78">≥ 32 calls</text><text class="muted" x="22" y="106">Not a final total</text><rect class="dash" x="18" y="126" width="112" height="30" rx="6"/></g>
  <g transform="translate(604,76)"><rect class="p" width="270" height="170" rx="10"/><rect class="neutral" x="16" y="22" width="14" height="14"/><text class="t" x="46" y="36">NOT APPLICABLE</text><text class="ink" x="22" y="78">No applicable population</text><text class="muted" x="22" y="106">No retry suggested</text></g>
  <g transform="translate(890,76)"><rect class="p" width="270" height="170" rx="10"/><circle class="neutral" cx="23" cy="30" r="8"/><text class="t" x="46" y="36">UNAVAILABLE</text><text class="ink" x="22" y="78">— missing call binding</text><text class="muted" x="22" y="106">Never displayed as zero</text></g>
  <g transform="translate(32,264)"><rect class="p" width="270" height="170" rx="10"/><path class="bad" d="M16 22 h16 v16 h-16z"/><text class="t" x="46" y="36">EXPIRED</text><text class="ink" x="22" y="78">Identity retained</text><text class="muted" x="22" y="106">Detail not reconstructed</text><text class="bad" x="22" y="144">重新选择</text></g>
  <g transform="translate(318,264)"><rect class="p" width="270" height="170" rx="10"/><path class="warn" d="M12 22 h22 l-11 18z"/><text class="t" x="46" y="36">INCOMPATIBLE</text><text class="ink" x="22" y="78">USD ↔ EUR</text><text class="muted" x="22" y="106">Before/After retained</text><text class="warn" x="22" y="144">Delta withheld</text></g>
  <g transform="translate(604,264)"><rect class="p" width="270" height="170" rx="10"/><text class="bad t" x="22" y="36">ERROR</text><text class="ink" x="22" y="78">Evidence query failed</text><text class="muted" x="22" y="106">Selection preserved</text><rect class="focus" x="18" y="124" width="82" height="34" rx="6"/><text class="ink" x="40" y="146">Retry</text></g>
  <g transform="translate(890,264)"><rect class="p" width="270" height="170" rx="10"/><text class="neutral t" x="22" y="36">LOADING</text><rect fill="#e5ecef" x="22" y="66" width="210" height="16" rx="8"/><rect fill="#e5ecef" x="22" y="98" width="150" height="12" rx="6"/><text class="muted" x="22" y="144">Loading, not zero</text></g>
  <rect class="p" x="32" y="456" width="1128" height="224" rx="10"/><text class="t" x="54" y="490">Interaction and motion states compose with truth</text><rect fill="#e8e2ff" stroke="#6b4eff" x="54" y="518" width="250" height="70" rx="8"/><text class="ink" x="76" y="548">SELECTED + FOCUSED</text><text class="muted" x="76" y="572">Fill/marker ≠ focus ring</text><rect fill="#edf3f6" stroke="#9aaab5" x="324" y="518" width="250" height="70" rx="8"/><text class="neutral" x="346" y="548">DISABLED</text><text class="muted" x="346" y="572">Readable reason</text><rect fill="#edf3f6" stroke="#9aaab5" x="594" y="518" width="250" height="70" rx="8"/><text class="neutral" x="616" y="548">REDUCED MOTION</text><text class="muted" x="616" y="572">Still · same final structure</text><text class="muted" x="54" y="638">Every state uses label + shape/border; color is redundant.</text>
</svg>
